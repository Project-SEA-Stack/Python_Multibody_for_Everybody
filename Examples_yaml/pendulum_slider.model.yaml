chrono-version: "9.0"
model:
  name: pendulum_slider
  angle_degrees: false

  bodies:
    - name: ground
      fixed: true
      location:    [0, 0, 0]
      orientation: [1, 0, 0, 0]         # quaternion [e0,e1,e2,e3]
      # inertia not required for fixed body
      visualization:
        shapes:
          - type: BOX
            dimensions: [1., 1, 0.01]
            location: [0, 0., 0]
            orientation: [0, 0, 0]
            color: [0., 0., 0.]

    - name: pendulum
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      orientation: [0, -0.78539816339, 0]
      location:    [0, 0, 0]
      com:
        location: [0, 0, -0.5]
      initial_angular_velocity: [0, 0, 0]
      initial_linear_velocity: [0, 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.1, 0.1, 1.125] # [length, width, height]
            location: [0, 0, -0.5]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.2, 0.6, 0.9]

    - name: slider
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      location:    [0, 0, 0.]
      orientation: [0, -0.78539816339, 0]
      com:
        location: [0, 0, -0.75]
      initial_angular_velocity: [0, 0, 0]
      initial_linear_velocity: [0, 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.5, 0.5, .25] # [length, width, height]
            location: [0, 0, -0.75]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.4, 0.4, 0.4]

  joints:
    - name: rev1
      type: REVOLUTE
      body1: ground
      body2: pendulum
      location: [0, 0, 0]               # joint location in the model (global) frame
      axis:     [0, 1, 0]               # hinge axis (global z)

    - name: slider_joint
      type: PRISMATIC
      body1: pendulum
      body2: slider
      location: [0, 0, -0.5]               # joint location in the model (global) frame
      axis:     [0.7071, 0, -0.7071]               # hinge axis (global z)

    