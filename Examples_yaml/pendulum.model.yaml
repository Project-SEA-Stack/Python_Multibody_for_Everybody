chrono-version: "9.0"
model:
  name: demo_MBS_revolute
  angle_degrees: false

  bodies:
    - name: ground
      fixed: true
      location:    [0, 0, 0]
      orientation: [1, 0, 0, 0]         # quaternion [e0,e1,e2,e3]
      # inertia not required for fixed body
      visualization:
        shapes:
          - type: BOX
            dimensions: [1., 1, 0.01]
            location: [0, 0., 0]
            orientation: [0, 0, 0]
            color: [0.4, 0.4, 0.4]

    - name: link
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      location:    [0, 0, -0.5]
      orientation: [1, 0, 0, 0]
      initial_angular_velocity: [0, -0.4, 0]
      initial_linear_velocity: [0.2, 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.1, 0.1, 1.0] # [length, width, height]
            location: [0, 0, 0]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.2, 0.6, 0.9]

  joints:
    - name: hinge
      type: REVOLUTE
      body1: ground
      body2: link
      location: [0, 0, 0]               # joint location in the model (global) frame
      axis:     [0, 1, 0]               # hinge axis (global z)

  # body_loads:
  #   - name: force_on_link
  #     type: FORCE
  #     body: link
  #     point: [0, 0, -0.5]             # point of application in body frame (COM is at [0, -0.5, 0])
  #     local_point: true                # point is given in local (body) frame
  #     load:   [0, 0, 0]               # force vector in global frame
  #     local_load: false            # load vector is given in global frame
