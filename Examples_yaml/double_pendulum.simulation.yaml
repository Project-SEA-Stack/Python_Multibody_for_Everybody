chrono-version: 9.0

simulation:
  # Required parameters
  time_step: 0.001
  contact_method: SMC

  # Optional parameters
  end_time: 30.0
  enforce_realtime: false
  gravity: [0, 0., -9.81]
  integrator_type: HHT
  solver_type: GMRES

  # Visualization settings
  visualization:
      type: PRIMITIVES   
      render_fps: 120
      enable_shadows: true
      camera:
          vertical: Z
          location: [0, -4, 0]
          target: [0, 0, 0]

  output:
      type: HDF5
      fps: 20
      output_directory: "."