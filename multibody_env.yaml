name: pyM4E_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - sympy
  - pandas
  - matplotlib
  - networkx
  - pyyaml
  - xarray
  - capytaine
  - pip
  - pip:
      - -e .

# Optional feature groups can be installed after activating this environment:
#   python -m pip install -e ".[docs]"
#   python -m pip install -e ".[moordyn]"
#   python -m pip install -e ".[moorpy]"
#   python -m pip install -e ".[wecopttool]"
