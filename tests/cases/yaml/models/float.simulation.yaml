chrono-version: 9.0

simulation:
  # Required parameters
  time_step: 0.001
  contact_method: SMC

  # Optional parameters
  end_time: 10.0
  enforce_realtime: false
  gravity: [0, 0., 0.]
  
  integrator:
    type: HHT
    rel_tolerance: 1.0e-8
    abs_tolerance_states: 1.0e-8
    abs_tolerance_multipliers: 1.0e-8
    max_iterations: 50

  # Visualization settings
  visualization:
      type: PRIMITIVES   
      render_fps: 120
      enable_shadows: true
      camera:
          vertical: Z
          location: [0,-4.,0]
          target: [0, 0, 0]

