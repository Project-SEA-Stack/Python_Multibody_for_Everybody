chrono-version: "9.0"
model:
  name: slider_with_double_pendulum
  angle_degrees: false

  bodies:
    - name: ground
      fixed: true
      location:    [0, 0, 0]
      orientation: [1, 0, 0, 0]         # quaternion [e0,e1,e2,e3]
      # inertia not required for fixed body
      visualization:
        shapes:
          - type: BOX
            dimensions: [1., 1, 0.01]
            location: [0, 0., 0]
            orientation: [0, 0, 0]
            color: [0., 0., 0.]

    - name: slider
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      location:    [0, 0, 0.125]
      orientation: [1, 0, 0, 0]
      initial_angular_velocity: [0, 0, 0]
      initial_linear_velocity: [0, 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.5, 0.5, .25] # [length, width, height]
            location: [0, 0, 0]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.4, 0.4, 0.4]

    - name: pendulum1
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      location:    [0, 0, -0.5]
      orientation: [1, 0, 0, 0]
      initial_angular_velocity: [0, 0, 0]
      initial_linear_velocity: [0, 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.1, 0.1, 1.125] # [length, width, height]
            location: [0, 0, 0]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.2, 0.6, 0.9]

    - name: pendulum2
      # put the body reference at its COM, 0.5 m below the hinge (so hinge is at world origin)
      location:    [0, 0, -1.5]
      orientation: [1, 0, 0, 0]
      initial_angular_velocity: [0, 0, 0.]
      initial_linear_velocity: [0., 0, 0]
      mass: 1.0
      inertia:
        moments:  [1,1,1]    # example values; replace with your actual moments
        products: [0.0, 0.0, 0.0]
      visualization:
        shapes:
          - type: BOX
            dimensions: [0.1, 0.1, 1.] # [length, width, height]
            location: [0, 0, 0]         # centered at COM
            orientation: [1, 0, 0, 0]
            color: [0.9, 0.6, 0.9]

  joints:
    - name: slider_joint
      type: PRISMATIC
      body1: ground
      body2: slider
      location: [0, 0., 0]               # joint location in the model (global) frame
      axis:     [-1, 0, 0]               # hinge axis (global z)

    - name: rev1
      type: REVOLUTE
      body1: slider
      body2: pendulum1
      location: [0, 0, 0.125]               # joint location in the model (global) frame
      axis:     [0, 1, 0]               # hinge axis (global z)

    - name: rev2
      type: REVOLUTE
      body1: pendulum1
      body2: pendulum2
      location: [0, 0, -1]               # joint location in the model (global) frame
      axis:     [0, 1, 0]               # hinge axis (global z)

  motors:
    - name: Fx_sine_mbody4
      type: LINEAR
      body1: ground
      body2: slider
      # Apply at slider CG (the motor acts along this line). Axis is GLOBAL X.
      location: [0, 0, 0.125]
      axis: [-1, 0, 0]
      actuation_type: FORCE
      actuation_function:
        type: SINE
        amplitude: 3.0
        frequency: 0.2387324146      # 1.5 / (2*pi) Hz
        phase: 1.5707963268          # +pi/2 rad so 3*sin(...) = 3*cos(1.5 t)
      guide: FREE       